services:
  - type: web
    name: dox-n-bots
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/leaderboard
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
